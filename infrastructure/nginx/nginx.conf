worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  map $http_x_request_id $correlation_id { default $request_id; "~^[a-zA-Z0-9._-]{1,128}$" $http_x_request_id; }
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  log_format structured escape=json '{"requestId":"$correlation_id","method":"$request_method","uri":"$uri","status":$status,"duration":$request_time}';
  access_log /dev/stdout structured;
  error_log /dev/stderr warn;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 8080;
    server_tokens off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_send_timeout 8s;
    client_max_body_size 16k;
    proxy_http_version 1.1;
    proxy_set_header X-Request-ID $correlation_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $correlation_id always;
    proxy_intercept_errors on;
    error_page 502 504 =503 @unavailable;
    location @unavailable { default_type application/json; return 503 '{"status":"unavailable","message":"Servicio temporalmente no disponible"}'; }
    location = /gateway/health { default_type application/json; return 200 '{"status":"ok"}'; }
    location = /api/inventory/docs { return 308 /api/inventory/docs/; }
    location = /api/auth/docs { return 308 /api/auth/docs/; }
    location ~ ^/api/auth/(docs.*)$ {
      set $identity identity-service:3004;
      rewrite ^/api/auth/(.*)$ /$1 break;
      proxy_pass http://$identity;
    }
    location = /api/auth/.well-known/jwks.json {
      set $identity identity-service:3004;
      rewrite ^/api/auth/(.*)$ /$1 break;
      proxy_pass http://$identity;
    }
    location ~ ^/api/auth/health/(live|ready)$ {
      set $identity identity-service:3004;
      rewrite ^/api/auth/(.*)$ /api/v1/$1 break;
      proxy_pass http://$identity;
    }
    location /api/auth/ {
      set $identity identity-service:3004;
      rewrite ^/api/auth/(.*)$ /api/v1/auth/$1 break;
      proxy_pass http://$identity;
    }
    location /api/inventory/ {
      set $backend inventory-service:3001;
      rewrite ^/api/inventory/(docs.*)$ /$1 break;
      rewrite ^/api/inventory/api/v1/(.*)$ /api/v1/$1 break;
      rewrite ^/api/inventory/(.*)$ /api/v1/$1 break;
      proxy_pass http://$backend;
    }
    location = /api/production/docs { return 308 /api/production/docs/; }
    location /api/production/ {
      set $backend production-service:3002;
      rewrite ^/api/production/(docs.*)$ /$1 break;
      rewrite ^/api/production/api/v1/(.*)$ /api/v1/$1 break;
      rewrite ^/api/production/(.*)$ /api/v1/$1 break;
      proxy_pass http://$backend;
    }
    location = /api/finance/docs { return 308 /api/finance/docs/; }
    location /api/finance/ {
      set $backend finance-reporting-service:3003;
      rewrite ^/api/finance/(docs.*)$ /$1 break;
      rewrite ^/api/finance/api/v1/(.*)$ /api/v1/$1 break;
      rewrite ^/api/finance/(.*)$ /api/v1/$1 break;
      proxy_pass http://$backend;
    }
    location / { set $web admin-web:3000; proxy_pass http://$web; }
  }
}
